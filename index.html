<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070714">
  <meta name="description" content="LOOP: Последний цикл — неоновая 2D-головоломка о свете, тенях и памяти.">
  <meta property="og:title" content="LOOP: Последний цикл">
  <meta property="og:description" content="Помоги Арзону и Пуши пройти двадцать испытаний Цикла.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./assets/og/loop-cover.png">
  <title>LOOP: Последний цикл</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <script src="https://yandex.ru/games/sdk/v2"></script>
  <script defer src="./vendor/phaser.min.js"></script>
</head>
<body>
  <main id="game-shell">
    <div id="game" aria-label="Игровое поле LOOP"></div>
    <div id="loading-screen" role="status" aria-live="polite">
      <div class="loading-content">
        <div class="loading-logo">LOOP</div>
        <div class="loading-subtitle">ПОСЛЕДНИЙ ЦИКЛ</div>
        <div class="loading-track"><div id="loading-progress"></div></div>
        <div id="loading-label">ПОДГОТОВКА МИРА...</div>
      </div>
    </div>
  </main>
  <script>
    (() => {
      const stop = event => event.preventDefault();
      document.addEventListener("contextmenu", stop, { passive: false });
      document.addEventListener("selectstart", stop, { passive: false });
      document.addEventListener("dragstart", stop, { passive: false });
      document.addEventListener("gesturestart", stop, { passive: false });
      document.addEventListener("touchmove", event => {
        if (event.touches.length > 1) stop(event);
      }, { passive: false });
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
